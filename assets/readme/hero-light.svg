<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">FDA — Fractal Domain Architecture</title>
  <desc id="heroDesc">Домен cart: +page.svelte — UI, +page.server.ts — server, stores.ts — контроллер, rpc.ts — RPC, model.server.ts — модель; субдомен items повторяет ту же структуру.</desc>

  <style>
    .sg { font-family: "Space Grotesk Variable", "Space Grotesk", ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
    .mono { font-family: "Space Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <defs>
    <linearGradient id="markAccent" gradientUnits="userSpaceOnUse" x1="140" y1="140" x2="248" y2="248">
      <stop offset="0" stop-color="#0b3e42"/>
      <stop offset="1" stop-color="#2a8f83"/>
    </linearGradient>
    <linearGradient id="cardAccent" gradientUnits="userSpaceOnUse" x1="140" y1="140" x2="248" y2="248">
      <stop offset="0" stop-color="#4fb3a9"/>
      <stop offset="1" stop-color="#93e6d6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="24" fill="#f5efe3"/>

  <!-- Lockup: mark v0 + name -->
  <g transform="translate(56,44) scale(0.375)">
    <g fill="#141413">
      <rect x="8" y="8" width="108" height="108"/>
      <rect x="140" y="8" width="108" height="108"/>
      <rect x="8" y="140" width="108" height="108"/>
    </g>
    <g fill="url(#markAccent)">
      <rect x="140" y="140" width="48" height="48"/>
      <rect x="200" y="140" width="48" height="48"/>
      <rect x="140" y="200" width="48" height="48"/>
      <rect x="200" y="200" width="48" height="48"/>
    </g>
  </g>
  <text class="sg" x="176" y="122" font-size="86" font-weight="700" letter-spacing="1" fill="#141413">FDA</text>

  <!-- Left column -->
  <line x1="56" y1="170" x2="664" y2="170" stroke="#e0d8c6" stroke-width="2"/>
  <text class="sg" x="56" y="216" font-size="36" font-weight="600" letter-spacing="-0.3" fill="#141413">Fractal Domain Architecture</text>
  <text class="sg" x="56" y="258" font-size="23" fill="#3d3d3a">Код вокруг бизнеса, а не вокруг типов файлов.</text>
  <text class="sg" x="56" y="292" font-size="19" fill="#6c6a64">SvelteKit · Next.js · Nuxt — одна структура домена</text>

  <!-- Layer chain: imports point down -->
  <g class="mono" font-size="18" fill="#0f5257" text-anchor="middle">
    <rect x="56" y="312" width="72" height="38" rx="8" fill="#e2ebe8"/>
    <text x="92" y="337">repo</text>
    <rect x="162" y="312" width="82" height="38" rx="8" fill="#e2ebe8"/>
    <text x="203" y="337">model</text>
    <rect x="278" y="312" width="61" height="38" rx="8" fill="#e2ebe8"/>
    <text x="308" y="337">rpc</text>
    <rect x="373" y="312" width="136" height="38" rx="8" fill="#e2ebe8"/>
    <text x="441" y="337">controller</text>
    <rect x="543" y="312" width="50" height="38" rx="8" fill="#e2ebe8"/>
    <text x="568" y="337">ui</text>
  </g>
  <g stroke="#a79c86" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M137 331h16M149 327l4 4-4 4"/>
    <path d="M253 331h16M265 327l4 4-4 4"/>
    <path d="M348 331h16M360 327l4 4-4 4"/>
    <path d="M518 331h16M530 327l4 4-4 4"/>
  </g>

  <!-- Domain card -->
  <rect x="704" y="48" width="440" height="304" rx="14" fill="#181715" stroke="#33302b" stroke-width="1.5"/>

  <g transform="translate(724,64) scale(0.09375)">
    <g fill="#f7f4ee">
      <rect x="8" y="8" width="108" height="108"/>
      <rect x="140" y="8" width="108" height="108"/>
      <rect x="8" y="140" width="108" height="108"/>
    </g>
    <g fill="url(#cardAccent)">
      <rect x="140" y="140" width="48" height="48"/>
      <rect x="200" y="140" width="48" height="48"/>
      <rect x="140" y="200" width="48" height="48"/>
      <rect x="200" y="200" width="48" height="48"/>
    </g>
  </g>
  <text class="mono" x="760" y="83" font-size="19" fill="#f7f4ee">src/routes/cart/</text>
  <text class="sg" x="1128" y="83" font-size="18" letter-spacing="1.5" fill="#9a948a" text-anchor="end">ДОМЕН</text>
  <line x1="720" y1="104" x2="1128" y2="104" stroke="#33302b" stroke-width="1.5"/>

  <g class="mono" font-size="19" fill="#f7f4ee">
    <text x="724" y="142">+page.svelte</text>
    <text x="724" y="176">+page.server.ts</text>
    <text x="724" y="210">stores.ts</text>
    <text x="724" y="244">rpc.ts</text>
    <text x="724" y="278">model.server.ts</text>
  </g>
  <g class="sg" font-size="18" letter-spacing="1.2" fill="#4fb3a9" text-anchor="end">
    <text x="1128" y="142">UI</text>
    <text x="1128" y="176">SERVER</text>
    <text x="1128" y="210">CONTROLLER</text>
    <text x="1128" y="244">RPC</text>
    <text x="1128" y="278">MODEL</text>
  </g>

  <rect x="720" y="294" width="408" height="42" rx="8" fill="#14332f"/>
  <g fill="url(#cardAccent)">
    <rect x="736" y="305" width="8" height="8"/>
    <rect x="748" y="305" width="8" height="8"/>
    <rect x="736" y="317" width="8" height="8"/>
    <rect x="748" y="317" width="8" height="8"/>
  </g>
  <text class="mono" x="766" y="321" font-size="19" fill="#f7f4ee">items/</text>
  <text class="sg" x="1112" y="321" font-size="18" letter-spacing="1.2" fill="#4fb3a9" text-anchor="end">ТА ЖЕ СТРУКТУРА</text>
</svg>
